<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Desk</title>
<link rel="stylesheet" href="publisher.css">
<link rel="stylesheet" href="publisher-panel.css">
</head>
<body class="sp">
  <header class="sp-top">
    <div class="brand"><img src="icons/outreach48.png" alt=""><div><strong>Outreach Desk</strong><span>Guest post research</span></div></div>
    <button class="btn small" id="open" type="button">Dashboard</button>
  </header>
  <main class="sp-body">
    <div id="error" class="banner error" role="alert" hidden></div>
    <section id="campaign"></section>
    <section id="metrics"></section>
    <section id="recent"></section>
    <section id="sources" class="sp-card sp-sources"></section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="publisher-panel.js"></script>
</body>
</html>
